name: Build JNI .so

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip jni.zip -d jni_src

    - name: Setup Android NDK
      uses: android-ndk/setup-ndk@v1
      with:
        ndk-version: r26b

    - name: Build .so Library
      run: |
        cd jni_src
        # 如果报错找不到文件，这里可能需要修改路径，比如改成 cd jni_src/jni
        $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
        -shared -fPIC \
        main.cpp 刷入.cpp \
        -o ../libflasher.so \
        -std=c++17 \
        -static-libstdc++ \
        -O2

    - name: Upload .so File
      uses: actions/upload-artifact@v4
      with:
        name: flasher-jni
        path: libflasher.so
